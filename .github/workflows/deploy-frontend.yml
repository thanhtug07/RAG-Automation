name: deploy-frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate JS syntax
        run: |
          node --check frontend/src/pages/dashboard/dashboard.js
          node --check frontend/src/pages/home/home.js
          node --check frontend/src/pages/documents/documents.js
          node --check frontend/src/pages/auth/login/login.js
          node --check frontend/src/pages/auth/register/register.js
      - name: Stage static site
        run: |
          mkdir -p site
          cp -r frontend/src/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
