name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node (JS syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JS syntax
        run: |
          node --check frontend/src/pages/dashboard/dashboard.js
          node --check frontend/src/pages/home/home.js
          node --check frontend/src/pages/documents/documents.js
          node --check frontend/src/pages/auth/login/login.js
          node --check frontend/src/pages/auth/register/register.js

      - name: Build Web Static Directory
        run: |
          mkdir -p public
          cp -r frontend/src/. public/
          cp CNAME public/ 2>/dev/null || true
          test -f public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
