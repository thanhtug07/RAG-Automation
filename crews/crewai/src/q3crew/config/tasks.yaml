# 6-task chain. {topic} and {context_text} filled per run via kickoff inputs.

collect_facts:
  description: >
    Collect the key facts needed to answer: {topic}.
    Work only from the provided data below. Cite the source of every figure.
    DATA:
    {context_text}
  expected_output: Figures table with sources.
  agent: researcher

retrieve_context:
  description: >
    From the collected facts, extract the passages that define terms and
    categories relevant to: {topic}.
  expected_output: Ranked passages with references.
  agent: rag_retriever
  context:
    - collect_facts

tabulate:
  description: >
    Tabulate the figures per category with units and sources.
  expected_output: Figures table with units and sources.
  agent: data_analyst
  context:
    - retrieve_context

synthesize:
  description: >
    Synthesize drivers and insights from the figures. Attribute every number.
  expected_output: Insight narrative with sourced figures.
  agent: analyst
  context:
    - tabulate

act:
  description: >
    List concrete follow-up actions derived from the insights, with owners.
  expected_output: Action list with owners.
  agent: executor
  context:
    - synthesize

verify:
  description: >
    Verify the action list against the insights. Report pass/fail per item
    with cited evidence.
  expected_output: Pass/fail report with citations.
  agent: reviewer
  context:
    - act
