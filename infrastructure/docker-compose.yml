services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_auto}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U rag"], interval: 10s, retries: 5}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 10s, retries: 5}
  backend:
    build: {context: .., dockerfile: infrastructure/docker/Dockerfile.backend}
    env_file: [../.env]
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: {context: .., dockerfile: infrastructure/docker/Dockerfile.backend}
    command: ["celery","-A","backend.execution.worker","worker"]
    env_file: [../.env]
    depends_on: [redis, postgres]
volumes: {pgdata: {}}
