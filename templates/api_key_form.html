{% extends 'base.html' %}
{% block title %}{{ 'Sửa' if api_key else 'Thêm' }} API Key{% endblock %}
{% block page_title %}<i class="bi bi-{{ 'pencil' if api_key else 'plus-circle' }}"></i> {{ 'Sửa' if api_key else 'Thêm' }} API Key{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Tên</label>
                        <input type="text" name="name" class="form-control" 
                               value="{{ api_key.name if api_key else '' }}" 
                               required placeholder="vd: OpenAI Production">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Provider</label>
                        <select name="provider" class="form-select" required>
                            <option value="">-- Chọn provider --</option>
                            <option value="openai" {{ 'selected' if api_key and api_key.provider == 'openai' }}>OpenAI</option>
                            <option value="google" {{ 'selected' if api_key and api_key.provider == 'google' }}>Google Gemini</option>
                            <option value="anthropic" {{ 'selected' if api_key and api_key.provider == 'anthropic' }}>Anthropic</option>
                            <option value="other" {{ 'selected' if api_key and api_key.provider == 'other' }}>Khác</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">API Key</label>
                        <input type="text" name="api_key" class="form-control" 
                               value="{{ api_key.api_key if api_key else '' }}" 
                               required placeholder="sk-... hoặc key tương ứng">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Model <small class="text-muted">(tùy chọn)</small></label>
                        <input type="text" name="model" class="form-control" 
                               value="{{ api_key.model if api_key else '' }}" 
                               placeholder="vd: gpt-4o-mini, gemini-pro...">
                    </div>

                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
                                   {{ 'checked' if not api_key or api_key.is_active }}>
                            <label class="form-check-label" for="is_active">Kích hoạt</label>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> {{ 'Cập nhật' if api_key else 'Thêm Key' }}
                        </button>
                        <a href="{{ url_for('api_keys_list') }}" class="btn btn-outline-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
