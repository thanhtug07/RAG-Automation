{% extends 'base.html' %}
{% block title %}{{ 'Sửa' if agent else 'Thêm' }} Agent{% endblock %}
{% block page_title %}<i class="bi bi-{{ 'pencil' if agent else 'plus-circle' }}"></i> {{ 'Sửa' if agent else 'Thêm' }} Agent{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">ID <small class="text-muted">(không thể thay đổi sau khi tạo)</small></label>
                        <input type="text" name="id" class="form-control" value="{{ agent.id if agent else '' }}" 
                               {{ 'readonly' if agent }} required placeholder="vd: lookup, analysis...">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tên Agent</label>
                        <input type="text" name="name" class="form-control" value="{{ agent.name if agent else '' }}" 
                               required placeholder="vd: Chuyên viên Tra cứu">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <input type="text" name="role" class="form-control" value="{{ agent.role if agent else '' }}" 
                               required placeholder="vd: Chuyên viên Tra cứu">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Goal</label>
                        <textarea name="goal" class="form-control" rows="2" required 
                                  placeholder="Mục tiêu của agent...">{{ agent.goal if agent else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Backstory</label>
                        <textarea name="backstory" class="form-control" rows="4" required
                                  placeholder="Mô tả về agent...">{{ agent.backstory if agent else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tools <small class="text-muted">(chọn nhiều)</small></label>
                        <div class="row">
                            {% for tool in available_tools %}
                            <div class="col-md-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="tools" value="{{ tool }}"
                                           id="tool_{{ tool }}" {{ 'checked' if agent and tool in agent.tools }}>
                                    <label class="form-check-label" for="tool_{{ tool }}">{{ tool }}</label>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="allow_delegation" id="allow_delegation"
                                   {{ 'checked' if agent and agent.allow_delegation }}>
                            <label class="form-check-label" for="allow_delegation">Cho phép ủy quyền (delegation)</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
                                   {{ 'checked' if not agent or agent.is_active }}>
                            <label class="form-check-label" for="is_active">Kích hoạt</label>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> {{ 'Cập nhật' if agent else 'Tạo Agent' }}
                        </button>
                        <a href="{{ url_for('agents_list') }}" class="btn btn-outline-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
